*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#0c3150 0,#06111f 45%,#030911 100%);color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:760px;width:100%;padding:28px;border:1px solid #168cff88;border-radius:22px;background:#071728dd;box-shadow:0 0 42px #168cff20}h1{margin:.1em 0;color:var(--cyan);letter-spacing:.04em}.pill{display:inline-block;border:1px solid #42ddff77;border-radius:999px;padding:6px 10px;color:#bcefff;background:#0a2940}code{color:#9beaff}.muted{color:var(--muted)}a{color:var(--cyan)}</style>

<body><main class="card"><span class="pill">GREY STREET · MCP</span><h1>Plugin server is online.</h1><p>This service exposes the public Grey Street 1991–2000 DMB live-history archive to compatible AI clients through a read-only Model Context Protocol endpoint.</p><p><strong>MCP endpoint:</strong> <code>/mcp</code></p><p class="muted">Public app: <a href="https://davematthewsbandcompanion.netlify.app/">davematthewsbandcompanion.netlify.app</a></p></main></body></html>
